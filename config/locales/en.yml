# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. If you want to use locales other
# than English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# The following keys must be escaped otherwise they will not be retrieved by
# the default I18n backend:
#
# true, false, on, off, yes, no
#
# Instead, surround them with single quotes.
#
# en:
#   "true": "foo"
#
# To learn more, please read the Rails Internationalization guide
# available at https://guides.rubyonrails.org/i18n.html.

en:
  hello: "Hello world"
  activerecord:
    errors:
      models:
        quality_result:
          attributes:
            passed:
              inclusion: "must be Pass or Fail"
  access:
    denied: "You don't have access to that page."
  costing_settings:
    update:
      invalid_rate: "Labor rate must be a positive number."
      updated: "Costing settings updated."
      invalid_accounts: "GL accounts must be Major-Sub, e.g. 1410-02: %{roles}"
      invalid_start_date: "GL posting start date must be a date."
  reporting_groups:
    create:
      created: "Added reporting group %{name}."
    update:
      updated: "Saved %{name}."
    destroy:
      deleted: "Deleted %{name}."
  production_orders:
    voided_read_only: "This production order is voided and can't be changed."
    record_quality:
      not_in_qc: "Quality checks are recorded while the order is in Quality Check."
      recorded:
        one: "Recorded 1 quality check."
        other: "Recorded %{count} quality checks."
    void:
      voided: "Production order %{number} voided; its inventory and any posted GL entry were reversed."
  purchase_orders:
    voided_read_only: "This purchase order is voided and can't be changed."
    void:
      voided: "Purchase order %{number} voided; anything it posted to inventory was reversed."
  users:
    registrations:
      turnstile_missing: "The security check didn't load. Refresh the page and complete the checkbox; if no checkbox appears, the Turnstile widget may not allow this domain."
      turnstile_failed: "Security check failed. Please try again."
    destroy:
      has_history: "%{name} has history in the app (%{reasons}), so they can't be deleted. Deactivate them instead."
    deactivate:
      deactivated: "%{name} is inactive and can no longer sign in."
      self: "You can't deactivate yourself."
    reactivate:
      reactivated: "%{name} is active again."
  quality_exceptions:
    review:
      reviewed: "Quality exception reviewed."
  jobs:
    update:
      updated: "Clock times updated; labor costing uses the new hours."
      posted_entry: "This order's journal entry is already posted with the old hours; reverse it on the GL Posting tab to repost."
      still_running: "Clock the crew out before editing times."
      invalid: "Times not saved: %{error}"
  ledger_entries:
    create:
      posted: "Posted journal entry %{reference}."
    reverse:
      reversed: "Posted reversing entry %{reference}."
    export:
      exported: "Exported %{count} entries to PDI."
      failed: "Export to PDI failed; nothing was marked exported. %{error}"
  customer_merges:
    create:
      merged: "Merged %{source} into %{target} (%{summary})."
      nothing_moved: "nothing to move"
      failed: "Merge failed: %{error}"
  pdi_master_data_imports:
    preview:
      fetch_failed: "Couldn't fetch PDI master data: %{error}"
    create:
      expired: "Preview expired. Please fetch from PDI again."
      imported: "Import complete. %{summary}. Errors: %{errors} (see the import history)."
      failed: "Import failed: %{error}"
    download:
      unavailable: "File not available."
