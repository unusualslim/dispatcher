name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  minitest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Debian 12, like Render. Also avoids apt on GitHub's Ubuntu runners, whose package
    # mirrors were unreachable in Nov 2026.
    container: ruby:3.4.11-bookworm

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/dispatcher_test
      BUNDLE_PATH: vendor/bundle

    steps:
      - uses: actions/checkout@v4

      # Active Storage loads ruby-vips at boot and needs libvips.
      - name: Install libvips
        timeout-minutes: 5
        run: apt-get update && apt-get install -y --no-install-recommends libvips42

      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-bookworm-${{ hashFiles('Gemfile.lock', '.ruby-version') }}

      - name: Install gems
        run: bundle install --jobs 4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # Layouts reference the esbuild/sass bundles, so integration tests need them built.
      - name: Build JS and CSS
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build
          yarn build:css

      # config/database.yml is gitignored; DATABASE_URL supplies the connection.
      - name: Database config
        run: |
          cat > config/database.yml <<'YAML'
          test:
            adapter: postgresql
            encoding: unicode
            url: <%= ENV['DATABASE_URL'] %>
          YAML

      - name: Set up database
        run: bin/rails db:create db:schema:load

      - name: Run tests
        run: bin/rails test
