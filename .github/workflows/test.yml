name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  minitest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dispatcher_test

    steps:
      - uses: actions/checkout@v4

      # Active Storage loads ruby-vips at boot and needs libvips.
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn

      # Layouts reference the esbuild/sass bundles, so integration tests need them built.
      - name: Build JS and CSS
        run: |
          yarn install --frozen-lockfile
          yarn build
          yarn build:css

      # config/database.yml is gitignored; DATABASE_URL supplies the connection.
      - name: Database config
        run: |
          cat > config/database.yml <<'YAML'
          test:
            adapter: postgresql
            encoding: unicode
            url: <%= ENV['DATABASE_URL'] %>
          YAML

      - name: Set up database
        run: bin/rails db:create db:schema:load

      - name: Run tests
        run: bin/rails test
